# AkhiBrowser for iOS in the Simulator: build, the site protection tests, and screenshots of the app, unsigned.
# With the private akhi-extension submodule (AkhiKit) it needs the secret AKHI_SUBMODULES_TOKEN, read access to it.
# The artifact holds the Simulator app, logs and screenshots, and GitHub deletes it after a day.
name: AkhiBrowser iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - akhi-*
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DERIVED: ${{ github.workspace }}/DerivedData
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.AKHI_SUBMODULES_TOKEN || github.token }}
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          xcode=${xcode:-$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)}
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          mkdir -p "$OUT"

      - name: Bootstrap
        run: sh ./bootstrap.sh firefox > "$OUT/bootstrap.log" 2>&1 || { tail -n 40 "$OUT/bootstrap.log"; exit 1; }

      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for r in reversed(runtimes) for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$udid"

      - name: Build
        working-directory: firefox-ios
        run: |
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile > "$OUT/resolve.log" 2>&1
          xcodebuild build-for-testing -project Client.xcodeproj -scheme Firefox -configuration Firefox \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES \
            DEPLOYMENT_POSTPROCESSING=NO STRIP_INSTALLED_PRODUCT=NO COPY_PHASE_STRIP=NO STRIP_SWIFT_SYMBOLS=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            > "$OUT/build.log" 2>&1 || { grep -E "error:|BUILD FAILED" "$OUT/build.log" | head -n 60; exit 1; }

      - name: Check that the app is AkhiBrowser
        run: |
          app=$(find "$DERIVED/Build/Products" -path "*iphonesimulator/Client.app" -maxdepth 3 | head -n 1)
          # sign every framework, extension and the app again, inside out: the simulator kills a process when the
          # first page of one of them changed after it was signed (AppAttestKit, WidgetKitExtension)
          sign() {
            entitlements="$RUNNER_TEMP/entitlements-$(basename "$1").plist"
            if codesign -d --entitlements "$entitlements" --xml "$1" 2>/dev/null && [ -s "$entitlements" ]; then
              codesign --force --sign - --timestamp=none --entitlements "$entitlements" "$1"
            else
              codesign --force --sign - --timestamp=none "$1"
            fi
          }
          find "$app" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) | while read -r part; do
            sign "$part"
          done
          sign "$app"
          id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist")
          name=$(/usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$app/Info.plist" 2>/dev/null || true)
          echo "$id $name"
          [ "$id" = "org.akhibrowser.ios" ] || { echo "::error::Built $id, not AkhiBrowser (org.akhibrowser.ios)"; exit 1; }
          # the simulator kills a process whose signature doesn't match its binary (SIGKILL, Code Signature Invalid)
          codesign --verify --deep --strict "$app" || { echo "::error::The app's code signature is invalid"; exit 1; }

      - name: AkhiKit tests
        if: hashFiles('akhi-extension/ios/Package.swift') != ''
        working-directory: akhi-extension/ios
        continue-on-error: true
        run: |
          xcodebuild test -scheme AkhiKit -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/AkhiKit" \
            -resultBundlePath "$OUT/AkhiKitTests.xcresult" > "$OUT/akhikit-tests.log" 2>&1
          result=$?
          grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)" "$OUT/akhikit-tests.log" | tail -n 40
          exit $result

      - name: AkhiPremiumKit tests
        if: hashFiles('akhi-premium/ios/AkhiPremiumKit/Package.swift') != ''
        working-directory: akhi-premium/ios/AkhiPremiumKit
        continue-on-error: true
        run: |
          xcodebuild test -scheme AkhiPremiumKit -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/AkhiPremiumKit" \
            -resultBundlePath "$OUT/AkhiPremiumKitTests.xcresult" > "$OUT/akhipremiumkit-tests.log" 2>&1
          result=$?
          grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)" "$OUT/akhipremiumkit-tests.log" | tail -n 40
          exit $result

      - name: Site protection tests
        if: hashFiles('akhi-extension/ios/Package.swift') == ''
        working-directory: firefox-ios
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json
          path = "firefox-ios-tests/Tests/UnitTest.xctestplan"
          plan = json.load(open(path))
          for target in plan["testTargets"]:
              if "ContentBlockerTests" in target.get("skippedTests", []):
                  target["skippedTests"].remove("ContentBlockerTests")
          json.dump(plan, open(path, "w"), indent=2)
          EOF
          xcodebuild test-without-building -project Client.xcodeproj -scheme Firefox -configuration Firefox -testPlan UnitTest \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" -only-testing:ClientTests/ContentBlockerTests \
            -resultBundlePath "$OUT/ContentBlockerTests.xcresult" > "$OUT/tests.log" 2>&1
          result=$?
          grep -E "Test Case|Executed|TEST (SUCCEEDED|FAILED)" "$OUT/tests.log" | tail -n 40
          exit $result

      - name: Launch check
        run: |
          app=$(find "$DERIVED/Build/Products" -path "*iphonesimulator/Client.app" -maxdepth 3 | head -n 1)
          id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist")
          # the tests leave the simulator shutting down: start it afresh and wait until it has booted
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          sleep 5
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 10
          xcrun simctl install "$UDID" "$app"
          touch "$RUNNER_TEMP/launched"
          for attempt in 1 2 3; do
            xcrun simctl launch "$UDID" "$id" && break
            echo "Launch refused (attempt $attempt), retrying"
            sleep 15
          done
          sleep 25
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$id"; then
            echo "$id still runs after 25 seconds"
            xcrun simctl terminate "$UDID" "$id" || true
            exit 0
          fi
          echo "::error::$id stopped within 25 seconds of its start"
          mkdir -p "$OUT/crash"
          find ~/Library/Logs/DiagnosticReports -name "*.ips" -newer "$RUNNER_TEMP/launched" -exec cp {} "$OUT/crash/" \; 2>/dev/null
          for report in "$OUT"/crash/*.ips; do
            [ -f "$report" ] || continue
            echo "== $(basename "$report")"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          crash = json.loads(body)
          print("process:", crash.get("procName"), "| exception:", json.dumps(crash.get("exception")))
          print("termination:", json.dumps(crash.get("termination"))[:600])
          print("vmRegionInfo:", crash.get("vmRegionInfo", "")[:800])
          for key in ("asi", "lastExceptionBacktrace"):
              if key in crash:
                  print(key + ":", json.dumps(crash[key])[:1500])
          images = crash.get("usedImages", [])
          thread = next((t for t in crash.get("threads", []) if t.get("triggered")), None)
          for frame in (thread or {}).get("frames", [])[:30]:
              image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex", -1) < len(images) else "?"
              print("  ", image, frame.get("symbol", hex(frame.get("imageOffset", 0))))
          PY
          done
          echo "== kernel code signing messages"
          log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "code signing" OR eventMessage CONTAINS[c] "codesign" OR eventMessage CONTAINS[c] "cs_invalid"' 2>/dev/null | grep -v "^Timestamp" | tail -n 30 || true
          echo "== every Mach-O file of the app"
          find "$app" -type f | while read -r file; do
            file "$file" | grep -q "Mach-O" || continue
            result=$(codesign --verify --strict "$file" 2>&1 && echo valid)
            echo "${file#$app/}: $(echo "$result" | tail -n 1) | $(codesign -dv "$file" 2>&1 | grep -E "^(Signature|TeamIdentifier|CodeDirectory)" | tr '\n' ' ')"
          done
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'process == "Client" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "fatal")' \
            > "$OUT/app-log.txt" 2>&1 || true
          tail -n 60 "$OUT/app-log.txt"
          exit 1

      - name: Screenshots
        continue-on-error: true
        run: |
          app=$(find "$DERIVED/Build/Products" -path "*iphonesimulator/Client.app" -maxdepth 3 | head -n 1)
          xcrun simctl bootstatus "$UDID" -b
          id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist")
          echo "Bundle id: $id"
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "$OUT/$1.png"; }
          xcrun simctl launch "$UDID" "$id"
          shot 1-first-start 20
          xcrun simctl terminate "$UDID" "$id" || true
          xcrun simctl launch "$UDID" "$id" FIREFOX_TEST FIREFOX_SKIP_INTRO FIREFOX_SKIP_WHATS_NEW \
            FIREFOX_SKIP_ETP_COVER_SHEET FIREFOX_SKIP_CONTEXTUAL_HINTS FIREFOX_SKIP_TERMS_OF_USE \
            SKIP_DEFAULT_BROWSER_ONBOARDING
          shot 2-home 15

      - name: Package the app
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AKHI_SUBMODULES_TOKEN }}
        run: |
          app=$(find "$DERIVED/Build/Products" -path "*iphonesimulator/Client.app" -maxdepth 3 | head -n 1)
          [ -n "$app" ] || exit 0
          if [ -d akhi-extension/ios ]; then
            # The app holds AkhiKit's private files: to the private draft release, not the public artifact
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/AkhiBrowser-ios-simulator.app.zip"
            # the screenshots for a review, but not the one of the adult site, in case it wasn't blocked
            screenshots=()
            for shot in "$OUT"/*.png; do
              case "$shot" in *adult*) ;; *) [ -f "$shot" ] && screenshots+=("$shot") ;; esac
            done
            gh release create "ios-build-${{ github.run_number }}" "$RUNNER_TEMP/AkhiBrowser-ios-simulator.app.zip" \
              "${screenshots[@]}" \
              --repo halgurdh/akhi-extension --draft --title "iOS build ${{ github.run_number }}" \
              --notes "Simulator, unsigned, from ${{ github.sha }}"
          else
            ditto -c -k --keepParent "$app" "$OUT/AkhiBrowser-ios-simulator.app.zip"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akhibrowser-ios-${{ github.run_number }}
          path: out
          retention-days: 1

  # A debug build (Fennec) with UI tests: the address bar's pages blocked, rewritten and with SafeSearch, and the
  # Family plan unlocked by UITestAppDelegate (debug builds only) to see the riba warning in a page.
  ui-tests:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DERIVED: ${{ github.workspace }}/DerivedData
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.AKHI_SUBMODULES_TOKEN || github.token }}
          persist-credentials: false

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          xcode=${xcode:-$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)}
          sudo xcode-select -s "$xcode/Contents/Developer"
          mkdir -p "$OUT"

      - name: Bootstrap
        run: sh ./bootstrap.sh firefox > "$OUT/bootstrap.log" 2>&1 || { tail -n 40 "$OUT/bootstrap.log"; exit 1; }

      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for r in reversed(runtimes) for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Build for the UI tests
        working-directory: firefox-ios
        run: |
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile > "$OUT/resolve.log" 2>&1
          xcodebuild build-for-testing -project Client.xcodeproj -scheme Fennec -testPlan Smoketest \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            > "$OUT/ui-build.log" 2>&1 || { grep -E "error:|BUILD FAILED" "$OUT/ui-build.log" | head -n 60; exit 1; }

      - name: Blocking, SafeSearch and Family UI tests
        working-directory: firefox-ios
        run: |
          set +e
          xcodebuild test-without-building -project Client.xcodeproj -scheme Fennec -testPlan Smoketest \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" \
            -only-testing:XCUITests/AkhiProtectionTests -only-testing:XCUITests/AkhiFamilyTests \
            -retry-tests-on-failure -test-iterations 2 -parallel-testing-enabled NO \
            > "$OUT/ui-tests.log" 2>&1
          result=$?
          grep -E "Test Case .*(passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED|EXECUTE FAILED)|Testing failed|xcodebuild: error" \
            "$OUT/ui-tests.log" | tail -n 80
          [ $result -eq 0 ] || tail -n 40 "$OUT/ui-tests.log"
          exit $result

      - name: AkhiBrowser's messages during the UI tests
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 60m --style compact \
            --predicate 'eventMessage CONTAINS "AkhiUITest" OR eventMessage BEGINSWITH "AkhiPageScripts" OR eventMessage CONTAINS "page scripts are missing" OR eventMessage CONTAINS "page shim"' \
            2>/dev/null | grep -v "^Timestamp" | tail -n 60 || true

      - name: Crashes of the app during the UI tests
        if: always()
        run: |
          for report in $(find ~/Library/Logs/DiagnosticReports -name "*.ips" -newer "$DERIVED" 2>/dev/null); do
            grep -q '"procName" *: *"Client"' "$report" || grep -q 'Fennec' "$report" || continue
            echo "== $(basename "$report")"
            python3 - "$report" <<'PY'
          import json, sys
          header, _, body = open(sys.argv[1]).read().partition("\n")
          crash = json.loads(body)
          print("process:", crash.get("procName"), "| exception:", json.dumps(crash.get("exception")))
          print("termination:", json.dumps(crash.get("termination"))[:400])
          for key in ("asi", "lastExceptionBacktrace"):
              if key in crash:
                  print(key + ":", json.dumps(crash[key])[:1500])
          images = crash.get("usedImages", [])
          thread = next((t for t in crash.get("threads", []) if t.get("triggered")), None)
          for frame in (thread or {}).get("frames", [])[:40]:
              index = frame.get("imageIndex", -1)
              image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
              print("  ", image, frame.get("symbol", hex(frame.get("imageOffset", 0))), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          PY
          done

      - name: Screenshots of the Family and SafeSearch tests
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AKHI_SUBMODULES_TOKEN }}
        run: |
          result=$(ls -d "$DERIVED"/Logs/Test/*.xcresult 2>/dev/null | tail -n 1)
          [ -n "$result" ] && [ -n "$GH_TOKEN" ] || exit 0
          xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/attachments" || exit 0
          # never the screenshots of the adult tests, in case a page wasn't blocked
          python3 - "$RUNNER_TEMP/attachments" > "$RUNNER_TEMP/shots.txt" <<'PY'
          import json, os, sys
          folder = sys.argv[1]
          for test in json.load(open(os.path.join(folder, "manifest.json"))):
              name = test.get("testIdentifier", "")
              if "AkhiFamilyTests" in name or "SafeSearch" in name or "Question" in name:
                  for attachment in test.get("attachments", []):
                      print(os.path.join(folder, attachment["exportedFileName"]))
          PY
          files=()
          while read -r file; do [ -f "$file" ] && files+=("$file"); done < "$RUNNER_TEMP/shots.txt"
          [ ${#files[@]} -gt 0 ] || exit 0
          gh release create "ios-uitests-${{ github.run_number }}" "${files[@]}" \
            --repo halgurdh/akhi-extension --draft --title "iOS UI tests ${{ github.run_number }}" \
            --notes "Screenshots of the Family and SafeSearch UI tests, from ${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akhibrowser-ios-ui-tests-${{ github.run_number }}
          path: out/*.log
          retention-days: 1
