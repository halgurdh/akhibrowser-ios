# Merges Mozilla's firefox-ios main into the branch firefox-daily every day at 00:30 UTC, and at once when CISA's list of
# exploited vulnerabilities gets a Firefox for iOS entry (checked every 2 hours). Nothing reaches main from here: a build
# takes firefox-daily when it's ready. A conflict, or something AkhiBrowser removed coming back
# (.github/scripts/firefox_sync_guard.py), stops it with an issue and a mail (.github/scripts/notify.sh).
# firefox-daily keeps its merges, so a conflict solved there once stays solved; AkhiBrowser's main is merged into it first.
# Secrets: AKHI_OPS_TOKEN (the mails; without it only the issue), AKHI_SUBMODULES_TOKEN (retries a refused push), AKHI_PUSH_TOKEN (a token with contents and workflows
# write on this repository: Mozilla often changes files under .github/workflows, which the workflow's own token can't
# push; without it such a merge stops at the push).
name: AkhiBrowser Firefox sync

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "45 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/akhibrowser-firefox-sync.yml, .github/scripts/firefox_sync_guard.py]

permissions:
  contents: write
  issues: write

concurrency:
  group: firefox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AKHI_OPS_TOKEN: ${{ secrets.AKHI_OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.AKHI_PUSH_TOKEN || github.token }}

      # Mozilla is a promisor remote too: in this partial clone, the merge's missing files come from there
      - name: Start from firefox-daily with AkhiBrowser's main
        id: start
        run: |
          echo "REPORT=$RUNNER_TEMP/report.md" >> "$GITHUB_ENV"
          REPORT="$RUNNER_TEMP/report.md"
          git config user.name "AkhiBrowser sync"
          git config user.email "support@akhibrowser.com"
          git remote add mozilla https://github.com/mozilla-mobile/firefox-ios.git
          git config remote.mozilla.promisor true
          git config remote.mozilla.partialclonefilter blob:none
          git fetch -q --filter=blob:none mozilla main
          if git fetch -q origin firefox-daily 2>/dev/null; then
            git checkout -q -B daily origin/firefox-daily
            echo "daily=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            if ! git merge --no-edit -m "Merge AkhiBrowser main into firefox-daily" origin/main > "$RUNNER_TEMP/merge.log" 2>&1; then
              {
                echo "### AkhiBrowser's main doesn't merge into firefox-daily"
                git diff --name-only --diff-filter=U | sed 's/^/- /'
                echo; echo '```'; tail -n 20 "$RUNNER_TEMP/merge.log"; echo '```'
              } > "$REPORT"
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git checkout -q -B daily origin/main
            echo "daily=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: A Firefox for iOS entry new on the list?
        id: urgent
        if: steps.start.outputs.failed != 'true' && github.event.schedule == '45 */2 * * *'
        run: |
          base=$(git log -1 --format=%cs "$(git merge-base HEAD mozilla/main)")
          count=$(curl -fsSL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json |
            jq --arg base "$base" '[.vulnerabilities[] | select(.vendorProject == "Mozilla" and (.product | test("ios"; "i")) and .dateAdded > $base)] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        if: steps.start.outputs.failed != 'true' && (github.event.schedule != '45 */2 * * *' || steps.urgent.outputs.count != '0')
        run: |
          before=$(git rev-parse HEAD)
          if git merge-base --is-ancestor mozilla/main HEAD; then
            echo "Nothing new from Mozilla."
          elif ! git merge --no-edit -m "Merge firefox-ios main into AkhiBrowser" mozilla/main > "$RUNNER_TEMP/merge.log" 2>&1; then
            {
              echo "### The merge with firefox-ios main has conflicts"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo; echo '```'; tail -n 20 "$RUNNER_TEMP/merge.log"; echo '```'
              echo; echo "Solve them on firefox-daily: the next sync starts from there."
            } > "$REPORT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! python3 .github/scripts/firefox_sync_guard.py "$before" > "$REPORT"; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "${{ steps.start.outputs.daily }}" ]; then
            if ! { git push origin HEAD:refs/heads/firefox-daily 2> "$RUNNER_TEMP/push.log" || { [ -n "${{ secrets.AKHI_SUBMODULES_TOKEN }}" ] && git -c http.https://github.com/.extraheader= push "https://x-access-token:${{ secrets.AKHI_SUBMODULES_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/firefox-daily 2>> "$RUNNER_TEMP/push.log"; }; }; then
              { echo "### firefox-daily couldn't be pushed"; echo '```'; cat "$RUNNER_TEMP/push.log"; echo '```'
                echo "If it's about workflow files: AKHI_SUBMODULES_TOKEN (the retry) needs Contents and Workflows write on this repository."; } > "$REPORT"
              echo "failed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Say what stopped it
        if: steps.start.outputs.failed == 'true' || steps.merge.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="iOS Firefox sync stopped on $(date -u +%F)"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            gh issue create --title "$title" --body-file "$REPORT"
          fi
          bash .github/scripts/notify.sh "AkhiBrowser: $title" "$REPORT"

      - name: Say what's urgent
        if: steps.merge.outputs.merged == 'true' && github.event.schedule == '45 */2 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "An exploited Firefox for iOS bug is fixed in firefox-daily: build the iPhone app from it." > "$RUNNER_TEMP/urgent.md"
          gh issue create --title "Exploited Firefox for iOS bug: firefox-daily has the latest code, build it" --body-file "$RUNNER_TEMP/urgent.md"
          bash .github/scripts/notify.sh "AkhiBrowser iOS: an exploited Firefox bug, build soon" "$RUNNER_TEMP/urgent.md"
